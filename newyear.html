<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year!</title>
<link rel="icon" href="./public/White_black_no_bg.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&family=Roboto:wght@400;700&display=swap');

:root{
  --primary-font: "Roboto", sans-serif;
  --secondary-font: "Raleway", sans-serif;
}

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body{
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #000;
  background-image:
    repeating-radial-gradient(circle at 0 0, transparent 0, #000 26px),
    repeating-linear-gradient(#ffffff55, #ffffff);
}

.container{
  perspective: 1200px;
}

.card{
  width: 350px;
  height: 250px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.7s ease;
}

.card.flipped{
  transform: rotateY(180deg);
}

.front, .back{
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(8px);
  background: rgba(0,0,0,0.35);
  backface-visibility: hidden;
}

.back{
  transform: rotateY(180deg);
}

.card img{
  height: 90px;
  margin-bottom: 10px;
}

h2{
  font-family: var(--primary-font);
  text-align: center;
}

p{
  font-family: var(--secondary-font);
  font-size: 0.85rem;
  text-align: center;
  margin: 5px 10px;
}

button{
  font-family: var(--secondary-font);
  margin-top: 10px;
  width: 90%;
  height: 2.6rem;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: #000;
  color: #fff;
}

/* Toast */
.toast{
  position: fixed;
  bottom: 20px;
  background: #000;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  font-family: var(--secondary-font);
  opacity: 0;
  transform: translateY(20px);
  transition: .4s;
}

.toast.show{
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<div class="container">
  <div class="card" id="card">
    <div class="front">
      <img src="/public/White_black_no_bg.png" alt="logo">
      <h2>Hello and welcome</h2>
      <p>
        We are excited to launch our cyber services this year.
        Click the button below to reveal your gift 🎁
      </p>
      <button id="revealBtn">Reveal Your Gift!</button>
    </div>

    <div class="back">
      <img src="/public/White_black_no_bg.png" alt="logo">
      <h2 id="giftText"></h2>
      <p>Valid until end of January</p>
      <p>Take a screenshot of this message</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlkV1RV57HiswLQSc9En7glOfypAdL2gU",
  authDomain: "thewebdevcyber.firebaseapp.com",
  databaseURL: "https://thewebdevcyber-default-rtdb.firebaseio.com",
  projectId: "thewebdevcyber",
  storageBucket: "thewebdevcyber.firebasestorage.app",
  messagingSenderId: "749003737236",
  appId: "1:749003737236:web:6e93df78669a3c8d2acc81"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const DEV_MODE = false;

/* Gift pools (weighted) */
const rareGifts = [
  "First printing is free!",
  "First Scanning is Free",
  "Free First Photocopy",
  "Free first Graphics Design"
];

const commonGifts = [
  "30% off any Website",
  "50% off first Printing",
  "50% off first Photocopy",
  "50% off Windows Installation",
  "50% off Microsoft Office Installation"
];

function fireConfetti(){
  confetti({
    particleCount: 160,
    spread: 90,
    origin: { y: 0.6 }
  });

  // second softer burst
  setTimeout(() => {
    confetti({
      particleCount: 80,
      spread: 120,
      startVelocity: 25,
      origin: { y: 0.7 }
    });
  }, 250);
}


function generateGift(){
  // 20% chance for free gift
  const isRare = Math.random() < 0.2;
  const pool = isRare ? rareGifts : commonGifts;
  return pool[Math.floor(Math.random() * pool.length)];
}

function generateUID(){
  return `${Date.now()}-${crypto.getRandomValues(new Uint32Array(1))[0]}`;
}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 3500);
}

const revealBtn = document.getElementById("revealBtn");
const card = document.getElementById("card");
const giftText = document.getElementById("giftText");

revealBtn.onclick = async () => {
  if(!DEV_MODE && localStorage.getItem("gift_claimed")){
    showToast("❌ Gift already claimed. One per person.");
    return;
  }

  if(DEV_MODE){
  console.warn("DEV MODE ENABLED — gift restrictions bypassed");
  localStorage.removeItem("gift_claimed");
  localStorage.removeItem("gift_id");
}

  const gift = generateGift();
  const uid = generateUID();

  giftText.textContent = gift;
  card.classList.add("flipped");
  fireConfetti();


  localStorage.setItem("gift_claimed", "true");
  localStorage.setItem("gift_id", uid);

  await set(ref(db, "gifts/" + uid), {
    gift,
    timestamp: Date.now()
  });

  showToast("🎉 Gift received successfully!");
};
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


</body>
</html>
